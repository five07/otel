name: CI

# Only on main: pushes, which include merges into it.
on:
  push:
    branches: [main]

env:
  # The V commit otel is built against: V master, the same as vgraph's, until a
  # 0.5.x release has what both need. Bump it on purpose.
  V_COMMIT: 04cb7fa314b95dfc5681768ed0598d53cb87e72e

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: otel
          persist-credentials: false
      - name: Restore V
        id: v-cache
        uses: actions/cache@v4
        with:
          path: vlang
          key: v-${{ runner.os }}-${{ env.V_COMMIT }}
      - name: Build V
        if: steps.v-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/vlang/v vlang
          git -C vlang checkout "$V_COMMIT"
          make -C vlang -j4
      - name: Install V
        run: sudo ./vlang/v symlink
      - name: Check that otel.version is v.mod's version
        # first, so a release with a half-bumped version fails fast
        run: v -nocache test otel/otel_test.v
      - name: Install otel as five07.otel, for the SDK, the examples and the snippets
        run: v run otel/examples/setup.vsh
      - name: Check formatting
        run: v fmt -verify otel
      - name: Check doc comments
        # the library modules only; -W makes a missing doc comment fail the job
        run: v vet -W otel/*.v otel/sdk otel/propagation otel/ref otel/exporters otel/semconv
      - name: Build the API docs
        # the library modules only (`.vdocignore`); fails on a doc that can't build
        run: v doc -f html -m -o "$RUNNER_TEMP/api" -no-timestamp otel
      - name: Test
        # -nocache: on V master, one `v test` session that runs a module's own
        # tests and then tests importing that module can hang or fail
        run: v -nocache test otel
