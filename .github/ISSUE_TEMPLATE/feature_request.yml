name: Feature request
description: Something otel should do, and doesn't.
labels: [feature request]
body:
  - type: textarea
    id: what
    attributes:
      label: What it's for
      description: What you are trying to instrument or export, and what stops you today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could look in code. A sketch is fine.
    validations:
      required: false

  - type: input
    id: standard
    attributes:
      label: In the spec or the Go SDK
      description: The part of the OpenTelemetry specification, or the Go SDK feature, it matches, if any, with a link.
      placeholder: https://opentelemetry.io/docs/specs/otel/...
    validations:
      required: false

  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Workarounds you use now, alternatives you considered, related issues.
    validations:
      required: false
